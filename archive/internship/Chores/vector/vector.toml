[api]
enabled = false

# ======================
# SOURCE
# ======================
[sources.nginx_access]
type = "file"
include = ["/var/log/nginx/access.log"]
read_from = "end"
ignore_older_secs = 86400

# ======================
# PARSE & ENRICH
# ======================
[transforms.parse_and_enrich]
type   = "remap"
inputs = ["nginx_access"]
source = '''
  parsed, err = parse_json(.message)
  if err != null {
    parsed, err = parse_nginx_log(.message, format: "combined")
    if err != null {
      parsed, err = parse_regex(.message, r'(?P<client>[0-9.]+) - (?P<user>\S+) \[(?P<time>[^\]]+)\] "(?P<request>[^"]+)" (?P<status>[0-9]+) (?P<size>[0-9]+)')
      if err != null {
        abort
      }
    }
  }

  . = merge!(., parsed)

  if exists(.referer) { .http_referer = .referer }

  if exists(.client) { .remote_addr = del(.client) }
  if exists(.agent)  { .user_agent  = del(.agent) }

  req, _ = to_string(.request)
  if req == "" { req, _ = to_string(.uri) }

  if req != "" {
    parts = split(req, " ")
    .method = get(parts, [0]) ?? "GET"
    .path   = get(parts, [1]) ?? "/"
    del(.request)
    del(.uri)
  }

  if exists(.time) {
    ts, err = parse_timestamp(.time, format: "%d/%b/%Y:%H:%M:%S %z")
    if err == null {
      .timestamp = ts
    } else {
      .timestamp = now()
    }
    del(.time)
  } else {
    .timestamp = now()
  }

  .status       = to_int(.status) ?? 0
  .bytes_sent   = to_int(.size) ?? 0
  .request_time = to_float(.request_time) ?? 0.0

  p, _ = to_string(.path)
  parts = split(p, "?")
  .path = get(parts, [0]) ?? p

  host, _ = get_hostname()
  .source_host = host

  del(.message)
'''

# ======================
# FILTER
# ======================
[transforms.filter_noise]
type = "filter"
inputs = ["parse_and_enrich"]
condition = '''
  path, _ = to_string(.path)
  !includes(["/health", "/healthz", "/ping", "/ready", "/favicon.ico"], path)
'''

# ======================
# RESHAPE TO OTLP FORMAT
# ======================
[transforms.to_otlp]
type   = "remap"
inputs = ["filter_noise"]
source = '''
  ts     = to_unix_timestamp!(.timestamp, unit: "nanoseconds")
  ts_str = to_string(ts)

  method  = to_string(.method)       ?? "GET"
  path    = to_string(.path)         ?? "/"
  status  = to_string(.status)       ?? "0"
  bytes   = to_string(.bytes_sent)   ?? "0"
  ua      = to_string(.user_agent)   ?? ""
  ip      = to_string(.remote_addr)  ?? ""
  host    = to_string(.source_host)  ?? ""
  referer = to_string(.http_referer) ?? "-"
  body    = method + " " + path + " " + status

  .resourceLogs = [{
    "resource": {
      "attributes": [
        {"key": "service.name",           "value": {"stringValue": "nginx"}},
        {"key": "deployment.environment", "value": {"stringValue": "production"}},
        {"key": "log.type",               "value": {"stringValue": "nginx_access"}},
        {"key": "host.name",              "value": {"stringValue": host}}
      ]
    },
    "scopeLogs": [{
      "logRecords": [{
        "timeUnixNano": ts_str,
        "body": {"stringValue": body},
        "attributes": [
          {"key": "method",       "value": {"stringValue": method}},
          {"key": "path",         "value": {"stringValue": path}},
          {"key": "status",       "value": {"stringValue": status}},
          {"key": "bytes_sent",   "value": {"stringValue": bytes}},
          {"key": "user_agent",   "value": {"stringValue": ua}},
          {"key": "remote_addr",  "value": {"stringValue": ip}},
          {"key": "referer",      "value": {"stringValue": referer}},
          {"key": "request_time", "value": {"stringValue": "0"}}
        ]
      }]
    }]
  }]

  rl = .resourceLogs
  . = {"resourceLogs": rl}
'''

# ======================
# SINK
# ======================
[sinks.otel_gateway]
type   = "http"
inputs = ["to_otlp"]
uri    = "http://10.135.4.67:4318/v1/logs"
method = "post"

[sinks.otel_gateway.encoding]
codec = "json"

[sinks.otel_gateway.framing]
method = "bytes"

[sinks.otel_gateway.batch]
max_events = 1

[sinks.otel_gateway.request.headers]
content-type = "application/json"
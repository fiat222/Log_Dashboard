name: logs-dashboard-ci

services:
  jenkins:
    build:
      context: ../..
      dockerfile: ci/jenkins/Dockerfile
    container_name: logs-dashboard-jenkins
    restart: unless-stopped
    ports:
      - "8081:8080"
      - "50000:50000"
    working_dir: /workspace
    volumes:
      - jenkins_home:/var/jenkins_home
      # Local learning/dev workflow: lets you exec into the already-running
      # Jenkins container and run the same scripts against this repository.
      - ../..:/workspace
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=true"

volumes:
  jenkins_home:

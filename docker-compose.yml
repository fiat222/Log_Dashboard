# =============================================================================
# docker-compose.yml — Log Dashboard Stack (v2 with Auth + Notifications)
# =============================================================================

name: logdashboard

networks:
  pipeline_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: "10.0.1.0/24"

volumes:
  redis_data:
  clickhouse_data:
  clickhouse_logs:
  postgres_data:
  backup_data:


services:

  # ── Traefik ────────────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    networks: [ pipeline ]
    # ports:  # Production: disable Traefik dashboard external access
    #   - "8443:443"
    #   - "8090:8080"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`localhost`)"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
    healthcheck:
      test: [ "CMD", "traefik", "healthcheck", "--ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── PostgreSQL (user management, roles, settings) ─────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    networks: [ pipeline ]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: logdash
      POSTGRES_USER: loguser
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-changeme}"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U loguser -d logdash" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2
    container_name: redis
    restart: unless-stopped
    networks: [ pipeline ]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server --appendonly yes --appendfsync everysec --save 60 1000 --maxmemory 128mb --maxmemory-policy allkeys-lru --loglevel warning
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── ClickHouse ────────────────────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: clickhouse
    restart: unless-stopped
    networks: [ pipeline ]
    # ports:  # Production: no direct access — nginx proxies /clickhouse/ internally
    #   - "8123:8123"
    #   - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - backup_data:/var/lib/clickhouse/user_files/backups
    environment:
      CLICKHOUSE_DB: logs
      CLICKHOUSE_USER: loguser
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-changeme}"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    healthcheck:
      test: [ "CMD", "clickhouse-client", "--query", "SELECT 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Filebeat ───────────────────────────────────────────────────────────────
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.0
    container_name: filebeat
    restart: unless-stopped
    networks: [ pipeline ]
    user: root
    command: >
      bash -c "cp /tmp/filebeat.yml /usr/share/filebeat/filebeat.yml && chmod go-w /usr/share/filebeat/filebeat.yml && filebeat -e -c /usr/share/filebeat/filebeat.yml"
    volumes:
      - ./filebeat.yml:/tmp/filebeat.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Log Ingester ───────────────────────────────────────────────────────────
  log-ingester:
    build: ./ingester
    container_name: log-ingester
    restart: unless-stopped
    networks: [ pipeline ]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_KEY: filebeat
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: logs
      CLICKHOUSE_USER: loguser
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-changeme}"
      BATCH_SIZE: "200"
      FLUSH_INTERVAL: "3"
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python3", "-c", "import os; exit(0)" ]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: backend
    restart: unless-stopped
    networks: [ pipeline ]
    environment:
      DATABASE_URL: "postgresql+asyncpg://loguser:${POSTGRES_PASSWORD:-changeme}@postgres:5432/logdash"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: logs
      CLICKHOUSE_USER: loguser
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-changeme}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-please-change-this-jwt-secret}"
      SUPER_ADMIN_USERNAME: "${SUPER_ADMIN_USERNAME:-superadmin}"
      SUPER_ADMIN_PASSWORD: "${SUPER_ADMIN_PASSWORD:-changeme_superadmin}"
      # PSU SSO (fill in when credentials available)
      AUTHENTIK_BASE_URL: "${AUTHENTIK_BASE_URL:-https://sso.psu.ac.th}"
      AUTHENTIK_CLIENT_ID: "${AUTHENTIK_CLIENT_ID:-}"
      AUTHENTIK_CLIENT_SECRET: "${AUTHENTIK_CLIENT_SECRET:-}"
      AUTHENTIK_REDIRECT_URI: "${AUTHENTIK_REDIRECT_URI:-https://monitor-eila.psu.ac.th/logstore/auth/callback}"
      APP_BASE_PATH: "/logstore"
      REDIS_HOST: redis
      # Webhook URL (Line / Slack / Discord)
      WEBHOOK_URL: "${WEBHOOK_URL:-}"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/logstore/api/auth/me" ]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Log Dashboard (Nginx) ──────────────────────────────────────────────────
  log-dashboard:
    build: ./dashboard
    container_name: log-dashboard
    restart: unless-stopped
    networks: [ pipeline ]
    ports:
      - "80:80"
    environment:
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-changeme}"
    depends_on:
      - backend
      - clickhouse
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Backup Cron Service ──────────────────────────────────────────────────
  backup:
    build: ./backup
    container_name: backup
    restart: unless-stopped
    networks: [ pipeline ]
    environment:
      POSTGRES_USER: loguser
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-changeme}"
      POSTGRES_DB: logdash
      CLICKHOUSE_USER: loguser
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-changeme}"
      CLICKHOUSE_DB: logs
    volumes:
      - backup_data:/backups
      - backup_data:/clickhouse_user_files/backups
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

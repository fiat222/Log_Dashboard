# =============================================================================
# filebeat.yml — Collect Docker container logs via Docker socket
# Enriches each event with container metadata labels.
# Output: Redis list "filebeat" (RPUSH) for ClickHouse ingester to consume.
# =============================================================================

filebeat.config:
  modules:
    path: ${path.config}/modules.d/*.yml
    reload.enabled: false

# ── Input: Docker container logs ─────────────────────────────────────────────
# "type: container" reads Docker's JSON log format automatically.
# Do NOT add json.message_key here — that causes double-parse errors
# when app logs are plain text (not JSON).
filebeat.inputs:
  - type: container
    paths:
      - "/var/lib/docker/containers/*/*.log"
    stream: all


# ── Processors: enrich every event ───────────────────────────────────────────
processors:
  # 1. Add Docker container metadata (name, image, labels) to every event.
  - add_docker_metadata:
      host: "unix:///var/run/docker.sock"
      # Fields added: docker.container.id, docker.container.name,
      #               docker.container.image.name, docker.container.labels.*

  # 2. Normalize "level" field from various log formats.
  - script:
      lang: javascript
      id: normalize_level
      source: >
        function process(event) {
          var msg = event.Get("message") || "";
          var lvl = event.Get("level") || "";
          // Detect level from message prefix keywords
          var lower = msg.toLowerCase();
          if (!lvl) {
            if (lower.indexOf("error") !== -1 || lower.indexOf("err") !== -1) {
              event.Put("level", "error");
            } else if (lower.indexOf("warn") !== -1) {
              event.Put("level", "warn");
            } else if (lower.indexOf("debug") !== -1) {
              event.Put("level", "debug");
            } else {
              event.Put("level", "info");
            }
          }
        }


  - rename:
      fields:
        - from: "docker.container.id"
          to: "container_id"
        - from: "docker.container.name"
          to: "container_name"
        - from: "docker.container.image.name"
          to: "image_name"
        - from: "host.name"
          to: "host"
      ignore_missing: true
      fail_on_error: false

# ── Output: Redis ─────────────────────────────────────────────────────────────
output.redis:
  hosts: ["${REDIS_HOST:redis}:${REDIS_PORT:6379}"]
  key: "filebeat"          # RPUSH to this list; ingester BLPOPs from it
  db: 0
  timeout: 5
  # Batch settings — tune for throughput vs. latency
  bulk_max_size: 500       # Max events per RPUSH call
  worker: 2                # Parallel Redis workers

# ── Internal Queue (memory) ───────────────────────────────────────────────────
# Decouples log read rate from Redis write rate.
queue.mem:
  events: 4096
  flush.min_events: 512
  flush.timeout: 5s

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level: warning     # Reduce noise; change to info to debug pipeline issues
logging.to_files: false    # Let Docker capture Filebeat's own logs

# ── Monitoring: expose metrics for Prometheus ─────────────────────────────────
http.enabled: true
http.host: "0.0.0.0"
http.port: 5066            # Prometheus can scrape /stats endpoint here

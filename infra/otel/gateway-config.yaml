extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 1024
    spike_limit_mib: 256

  filter:
    logs:
      exclude:
        match_type: regexp
        bodies: ['^\s*$']

  transform:
    log_statements:
      - context: log
        statements:
          - set(severity_text, "ERROR") where severity_text == "" and IsMatch(body, "(?i).*(error|fatal|panic|exception).*")
          - set(severity_text, "WARN") where severity_text == "" and IsMatch(body, "(?i).*(warn|warning).*")
          - set(severity_text, "DEBUG") where severity_text == "" and IsMatch(body, "(?i).*(debug|trace).*")
          - set(severity_text, "INFO") where severity_text == ""
          - set(resource.attributes["container.name"], attributes["attrs"]["com.docker.compose.service"]) where attributes["attrs"] != nil
          - set(resource.attributes["container.label.com.docker.compose.project"], attributes["attrs"]["com.docker.compose.project"]) where attributes["attrs"] != nil
          - delete_key(attributes, "attrs")
          - set(resource.attributes["service.name"], resource.attributes["container.name"]) where resource.attributes["service.name"] == ""

  batch:
    send_batch_size: 4096
    send_batch_max_size: 8192
    timeout: 500ms

exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000?compress=lz4&async_insert=1&wait_for_async_insert=0
    username: ${env:CLICKHOUSE_USER}
    password: ${env:CLICKHOUSE_PASSWORD}
    database: observability
    logs_table_name: otel_logs_ingress
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 10000

service:
  extensions: [health_check]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, filter, transform, batch]
      exporters: [clickhouse]
  telemetry:
    metrics:
      address: 0.0.0.0:8888
    logs:
      level: warn

groups:
  - name: pipeline_alerts
    rules:
      # ── Filebeat is down (no container metrics for > 2 min) ───────────────
      # Constraint #10: alert in Grafana if Filebeat stops shipping
      - alert: FilebeatContainerDown
        expr: |
          absent(container_last_seen{name="filebeat"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Filebeat container is missing"
          description: >
            The Filebeat container has not been seen by cAdvisor for more than 2 minutes.
            Logs may NOT be flowing to Redis/ClickHouse. Check: docker ps | grep filebeat

      # ── Redis memory near limit (>90% of 512 MB) ──────────────────────────
      - alert: RedisMemoryHigh
        expr: |
          container_memory_usage_bytes{name="redis"} / (512 * 1024 * 1024) > 0.90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage is above 90%"
          description: >
            Redis is using over 90% of maxmemory (512 MB). allkeys-lru will
            begin evicting logs. Consider increasing maxmemory or scaling ClickHouse.

      # ── ClickHouse is unreachable ──────────────────────────────────────────
      - alert: ClickHouseDown
        expr: |
          absent(container_last_seen{name="clickhouse"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ClickHouse container is down"
          description: "ClickHouse has not been seen for 2+ minutes. Log storage is unavailable."

      # ── Ingester CPU spike (possible Redis queue buildup) ─────────────────
      - alert: IngesterCPUHigh
        expr: |
          rate(container_cpu_usage_seconds_total{name="log-ingester"}[5m]) > 0.25
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Log ingester CPU is high"
          description: >
            The log-ingester is using high CPU. This may indicate a Redis queue
            backlog or ClickHouse insert slowdown.

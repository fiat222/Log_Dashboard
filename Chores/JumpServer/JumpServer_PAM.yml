services:
  db:
    image: mysql:8.0
    container_name: jms_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./data/db:/var/lib/mysql
    networks:
      - jms_net

  redis:
    image: redis:7.0
    container_name: jms_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    networks:
      - jms_net

  core:
    image: jumpserver/core:${VERSION}
    container_name: jms_core
    restart: always
    env_file: .env
    volumes:
      - ./data/core:/opt/jumpserver/data
    depends_on:
      - db
      - redis
    networks:
      - jms_net

  koko:
    image: jumpserver/koko:${VERSION}
    container_name: jms_koko
    restart: always
    env_file: .env
    ports:
      - ${SSH_PORT}:2222
    volumes:
      - ./data/koko:/opt/koko/data
    depends_on:
      - core
    networks:
      - jms_net
    privileged: true

  lion:
    image: jumpserver/lion:${VERSION}
    container_name: jms_lion
    restart: always
    env_file: .env
    volumes:
      - ./data/lion:/opt/lion/data
    depends_on:
      - core
    networks:
      - jms_net

  chen:
    image: jumpserver/chen:${VERSION}
    container_name: jms_chen
    restart: always
    env_file: .env
    volumes:
      - ./data/chen:/opt/chen/data
    depends_on:
      - core
    networks:
      - jms_net

  web:
    image: jumpserver/web:${VERSION}
    container_name: jms_web
    restart: always
    ports:
      - ${HTTP_PORT}:51980
    volumes:
      - ./data/web:/var/log/nginx
      - ./data/core:/opt/jumpserver/data
    depends_on:
      - core
      - koko
      - lion
    networks:
      - jms_net

networks:
  jms_net:
    driver: bridge
<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log Dashboard — PSU Login</title>
  <meta name="description" content="Sign in to PSU Container Log Dashboard" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --psu-blue: #004B93;
      --psu-blue-dark: #003A74;
      --psu-light-blue: #3b82f6;
      --psu-btn-light-blue: #bae6fd;
      --psu-btn-light-blue-hover: #7dd3fc;
      --bg: #dbeafe;
      --surface: rgba(255, 255, 255, 0.55);
      --border: rgba(255, 255, 255, 0.72);
      --text: #0f172a;
      --text-muted: #475569;
      --error: #dc2626;
      --success: #059669;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #dbeafe 0%, #eff6ff 50%, #e0f2fe 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Animated orbs */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      animation: float 8s ease-in-out infinite;
      pointer-events: none;
    }

    .bg-orb-1 {
      width: 600px;
      height: 600px;
      background: var(--psu-blue);
      top: -140px;
      left: -140px;
      animation-delay: 0s;
    }

    .bg-orb-2 {
      width: 500px;
      height: 500px;
      background: var(--psu-light-blue);
      bottom: -100px;
      right: -80px;
      animation-delay: -3s;
    }

    .bg-orb-3 {
      width: 400px;
      height: 400px;
      background: #93c5fd;
      top: 45%;
      left: 42%;
      animation-delay: -5s;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-28px) scale(1.05);
      }
    }

    /* Card — glassmorphism on light bg */
    .login-card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.58);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 24px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 24px 64px rgba(0, 75, 147, 0.18), 0 2px 8px rgba(0, 0, 0, 0.06);
      overflow: hidden;
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    /* PSU blue top bar */
    .card-header {
      background: linear-gradient(135deg, var(--psu-blue) 0%, var(--psu-blue-dark) 100%);
      padding: 36px 52px 30px;
      text-align: center;
    }

    .logo-icon {
      width: 72px;
      height: 72px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin-bottom: 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .logo-title {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .logo-subtitle {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 3px;
    }

    /* Card body */
    .card-body {
      padding: 40px 52px 48px;
    }

    /* SSO Button */
    .btn-sso {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 15px 20px;
      background: linear-gradient(135deg, var(--psu-blue) 0%, var(--psu-blue-dark) 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(0, 75, 147, 0.25);
      margin-bottom: 20px;
    }

    .btn-sso:hover {
      background: var(--psu-blue-dark);
      box-shadow: 0 4px 18px rgba(0, 75, 147, 0.4);
      transform: translateY(-1px);
    }

    .btn-sso:active {
      transform: scale(0.98);
    }

    .psu-icon {
      font-size: 18px;
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #000;
    }

    .divider-text {
      font-size: 15px;
      color: #000;
      white-space: nowrap;
    }

    /* Admin form */
    .admin-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.01em;
    }

    .form-input {
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(0, 75, 147, 0.18);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      padding: 13px 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input:focus {
      border-color: var(--psu-blue);
      box-shadow: 0 0 0 3px rgba(0, 75, 147, 0.12);
      background: #fff;
    }

    .form-input::placeholder {
      color: #b0bec5;
    }

    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-wrapper input {
      width: 100%;
      padding-right: 44px;
    }

    .pw-toggle {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      font-size: 12px;
      font-weight: 600;
      transition: color 0.2s;
    }

    .pw-toggle:hover {
      color: var(--psu-blue);
    }

    /* Light blue submit button */
    .btn-admin {
      background: var(--psu-btn-light-blue);
      color: #003A74;
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
      margin-top: 4px;
      box-shadow: 0 4px 12px rgba(186, 230, 253, 0.4);
    }

    .btn-admin:hover {
      background: var(--psu-btn-light-blue-hover);
      box-shadow: 0 6px 16px rgba(186, 230, 253, 0.5);
      transform: translateY(-1px);
    }

    .btn-admin:active {
      transform: scale(0.98);
    }

    .btn-admin:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Error banner */
    .error-banner {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      color: var(--error);
      font-size: 13px;
      padding: 10px 14px;
      display: none;
    }

    .error-banner.show {
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(26, 32, 44, 0.25);
      border-top-color: #1a202c;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 4px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>

  <div class="login-card">
    <!-- PSU Blue header -->
    <div class="card-header">
      <div class="logo-icon">📊</div>
      <div class="logo-title">Log Dashboard</div>
      <div class="logo-subtitle">Prince of Songkla University · EILA</div>
    </div>

    <div class="card-body">
      <!-- PSU SSO Button -->
      <a id="btn-sso" class="btn-sso" href="/logstore/auth/sso">
        <span class="psu-icon">🎓</span>
        Sign in with PSU Passport
      </a>

      <div class="divider">
        <span class="divider-text">หรือเข้าสู่ระบบด้วย Admin</span>
      </div>

      <!-- User/Admin form -->
      <form class="admin-form" id="admin-form">
        <div class="error-banner" id="error-msg"></div>
        <div class="form-group">
          <label for="username">Username</label>
          <input id="username" class="form-input" type="text" placeholder="username" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input id="password" class="form-input" type="password" placeholder="••••••••"
              autocomplete="current-password" required />
            <button type="button" id="pw-toggle" class="pw-toggle" title="Show/Hide password"
              tabindex="-1">show</button>
          </div>
        </div>
        <button type="submit" class="btn-admin" id="login-btn">
          เข้าสู่ระบบ
        </button>
      </form>
    </div>
  </div>

  <script>
    const pwToggle = document.getElementById("pw-toggle");
    const pwInput = document.getElementById("password");
    pwToggle.addEventListener("click", () => {
      const type = pwInput.getAttribute("type") === "password" ? "text" : "password";
      pwInput.setAttribute("type", type);
      pwToggle.textContent = type === "password" ? "show" : "hide";
    });

    document.getElementById("admin-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("login-btn");
      const errEl = document.getElementById("error-msg");
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> กำลังเข้าสู่ระบบ...';
      errEl.classList.remove("show");

      try {
        const res = await fetch("/logstore/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
          credentials: "include"
        });
        if (res.ok) {
          window.location.href = "/logstore/";
        } else {
          const data = await res.json().catch(() => ({}));
          errEl.textContent = data.detail || "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง";
          errEl.classList.add("show");
        }
      } catch (err) {
        errEl.textContent = "ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้";
        errEl.classList.add("show");
      } finally {
        btn.disabled = false;
        btn.textContent = "เข้าสู่ระบบ";
      }
    });
  </script>
</body>

</html>

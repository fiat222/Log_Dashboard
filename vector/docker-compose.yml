services:
  vector:
    image: timberio/vector:0.38.0-alpine
    container_name: vector_nginx
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./vector.toml:/etc/vector/vector.toml:ro
      - /var/log/nginx:/var/log/nginx:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

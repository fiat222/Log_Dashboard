services:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    container_name: cadvisor
    restart: always
    network_mode: host
    privileged: true
    environment:
      - TZ=Asia/Bangkok
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - '-port=8081'
      - '-listen_ip=0.0.0.0'
      - '-docker_only=true'
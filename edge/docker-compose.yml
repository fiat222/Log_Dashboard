name: observability-edge

networks:
  edge_network:
    driver: bridge

services:
  vector:
    image: timberio/vector:0.54.0-alpine
    container_name: observability-edge-vector
    restart: unless-stopped
    user: root
    networks:
      - edge_network
    environment:
      EDGE_HOST_ID: ${EDGE_HOST_ID:?EDGE_HOST_ID is required}
      EDGE_SITE: ${EDGE_SITE:-default}
      EDGE_ENV: ${EDGE_ENV:-dev}
      CENTRAL_OTEL_ENDPOINT: ${CENTRAL_OTEL_ENDPOINT:?CENTRAL_OTEL_ENDPOINT is required}
      VECTOR_LOG_LEVEL: ${VECTOR_LOG_LEVEL:-info}
    volumes:
      - ./vector/vector.toml:/etc/vector/vector.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["--config", "/etc/vector/vector.toml"]
    security_opt:
      - no-new-privileges:true

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: observability-edge-node-exporter
    restart: unless-stopped
    networks:
      - edge_network
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    security_opt:
      - no-new-privileges:true

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: observability-edge-cadvisor
    restart: unless-stopped
    networks:
      - edge_network
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "${CADVISOR_PORT:-8080}:8080"
    security_opt:
      - no-new-privileges:true

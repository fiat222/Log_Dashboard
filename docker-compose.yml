# Log Dashboard Stack

name: logdashboard

x-logging: &default-logging
  driver: "local"
  options:
    max-size: "10m"
    max-file: "3"

networks:
  pipeline_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: "10.0.1.0/24"

volumes:
  redis_data:
  clickhouse_data:
  clickhouse_logs:
  postgres_data_local:

services:

  # Docker Socket Proxy - read-only Docker Events/Containers API
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-proxy
    restart: unless-stopped
    networks: [ pipeline_network ]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      EVENTS: "1"
      CONTAINERS: "1"
      IMAGES: "0"
      NETWORKS: "0"
      VOLUMES: "0"
      POST: "0"
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # Redis - sessions, cache, and rate limiting
  redis:
    image: redis:7.2
    container_name: redis
    restart: unless-stopped
    networks: [ pipeline_network ]
    volumes:
      - redis_data:/data
    command: >
      redis-server --appendonly yes --appendfsync everysec --no-appendfsync-on-rewrite yes --save "" --maxmemory 128mb --maxmemory-policy allkeys-lru --loglevel warning --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 192m
          cpus: "0.5"
    logging: *default-logging

  # ClickHouse - log storage
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: clickhouse
    restart: unless-stopped
    networks: [ pipeline_network ]
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./infra/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./infra/clickhouse/config.d/timezone.xml:/etc/clickhouse-server/config.d/timezone.xml:ro
      - ./infra/clickhouse/config.d/async_insert.xml:/etc/clickhouse-server/config.d/async_insert.xml:ro
      - /mnt/Logstore_backup:/var/lib/clickhouse/backups
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "clickhouse-client --user $CLICKHOUSE_USER --password $CLICKHOUSE_PASSWORD --query 'SELECT 1'" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2.0"
        reservations:
          memory: 1g
    logging: *default-logging

  # Vector - Docker container log collector
  # user: root is required to read the Docker socket.
  vector-containers:
    image: timberio/vector:0.54.0-alpine
    container_name: vector-containers
    restart: unless-stopped
    user: root
    networks: [ pipeline_network ]
    volumes:
      - ./infra/vector/vector-containers.toml:/etc/vector/vector.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: [ "--config", "/etc/vector/vector.toml" ]
    depends_on:
      otel-gateway:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    logging: *default-logging

  # OTel Collector Gateway
  otel-gateway:
    image: otel/opentelemetry-collector-contrib:0.100.0
    container_name: otel-gateway
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    networks: [ pipeline_network ]
    tmpfs:
      - /tmp
    ports:
      - "8888:8888"
      - "4318:4318"
      - "4317:4317"
    volumes:
      - ./infra/otel/gateway-config.yaml:/etc/otel/config.yaml:ro
    command: [ "--config=/etc/otel/config.yaml" ]
    env_file:
      - .env
    depends_on:
      clickhouse:
        condition: service_healthy
    # No Docker healthcheck: distroless image has no wget/shell to exec.
    # Health monitored externally via Prometheus scrape on :8888/metrics
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1200m
          cpus: "1.0"
        reservations:
          memory: 256m
    logging: *default-logging

  # PostgreSQL - platform metadata store
  postgres:
    image: postgres:16-alpine
    container_name: log-postgres
    restart: unless-stopped
    networks: [ pipeline_network ]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logpass}
      POSTGRES_DB: ${POSTGRES_DB:-logdash}
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loguser} -d ${POSTGRES_DB:-logdash}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    logging: *default-logging

  # FastAPI backend
  backend:
    image: logs-dashboard-backend:${TAG:-local}
    build: ./apps/api
    container_name: log-backend
    restart: unless-stopped
    stop_grace_period: 30s
    networks: [ pipeline_network ]
    environment:
      DOCKER_HOST: "tcp://docker-proxy:2375"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-loguser}:${POSTGRES_PASSWORD:-logpass}@postgres:5432/${POSTGRES_DB:-logdash}
    env_file:
      - .env
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "-q", "http://localhost:8000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "1.0"
        reservations:
          memory: 256m
    logging: *default-logging

  # Log Dashboard UI
  log-dashboard:
    image: dashboard:${TAG:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: log-dashboard
    restart: unless-stopped
    networks: [ pipeline_network ]
    ports:
      - "8801:80"
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.25"
    logging: *default-logging

  # Backup worker
  backup:
    image: logs-dashboard-backup:${TAG:-local}
    build: ./apps/backup
    container_name: backup
    restart: unless-stopped
    user: root
    networks: [ pipeline_network ]
    env_file:
      - .env
    volumes:
      - /mnt/Logstore_backup:/backups
    depends_on:
      clickhouse:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    logging: *default-logging
  # ClickHouse - log storage
  ch-ui:
    image: nginxinc/nginx-unprivileged:1.25
    container_name: ch-ui
    restart: unless-stopped
    networks: [ pipeline_network ]
    environment:
      VITE_CLICKHOUSE_URL: /logstore/ch-api
      VITE_CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      VITE_CLICKHOUSE_PASS: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    depends_on:
      clickhouse:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    logging: *default-logging
  # Prometheus, Grafana, Alertmanager, and cAdvisor run outside this stack.

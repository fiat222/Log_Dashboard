# =============================================================================
# docker-compose.yml — Log Dashboard Stack (v2 with Auth + Notifications)
# =============================================================================

name: logdashboard

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
    labels: "com.docker.compose.project,com.docker.compose.service"

networks:
  pipeline_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: "10.0.1.0/24"

volumes:
  redis_data:
  clickhouse_data:
  clickhouse_logs:
  postgres_data:

services:

  # ── PostgreSQL (user management, roles, settings) ─────────────────────────
  postgres:
    image: ${REGISTRY_IMAGE_PATH}/postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    networks: [ pipeline_network ]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U loguser -d logdash" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: ${REGISTRY_IMAGE_PATH}/redis:7.2
    container_name: redis
    restart: unless-stopped
    networks: [ pipeline_network ]
    # No public port — internal access only
    volumes:
      - redis_data:/data
    command: >
      redis-server --appendonly yes --appendfsync everysec --save 60 1000 --maxmemory 128mb --maxmemory-policy allkeys-lru --loglevel warning --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # ── ClickHouse ────────────────────────────────────────────────────────────
  clickhouse:
    image: ${REGISTRY_IMAGE_PATH}/clickhouse-server:24.3-alpine
    container_name: clickhouse
    restart: unless-stopped
    networks: [ pipeline_network ]
    # ports:  # Production: no direct access — nginx proxies /clickhouse/ internally
    #   - "8123:8123"
    #   - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./clickhouse/config.d/timezone.xml:/etc/clickhouse-server/config.d/timezone.xml:ro
      - ./clickhouse/config.d/async_insert.xml:/etc/clickhouse-server/config.d/async_insert.xml:ro
      - /mnt/Logstore_backup:/var/lib/clickhouse/user_files/backups
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "clickhouse-client", "--query", "SELECT 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # ── Vector — Docker container log collector ───────────────────────────────
  vector-containers:
    image: ${REGISTRY_IMAGE_PATH}/vector:0.54.0-alpine
    container_name: vector-containers
    restart: unless-stopped
    user: root
    networks: [ pipeline_network ]
    volumes:
      - ./vector/vector-containers.toml:/etc/vector/vector.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: [ "--config", "/etc/vector/vector.toml" ]
    depends_on:
      otel-gateway:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # ── OTel Collector Gateway ─────────────────────────────────────────────────
  otel-gateway:
    image: ${REGISTRY_IMAGE_PATH}/otel-collector-contrib:0.100.0
    container_name: otel-gateway
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    networks: [ pipeline_network ]
    tmpfs:
      - /tmp
    ports:
      - "8888:8888" # Prometheus metrics (meta-monitoring)
      - "4318:4318" # OTLP/HTTP — Vector from external VMs
      - "4317:4317" # OTLP/gRPC — Vector from external VMs
    volumes:
      - ./otel/gateway-config.yaml:/etc/otel/config.yaml:ro
    command: [ "--config=/etc/otel/config.yaml" ]
    env_file:
      - .env
    depends_on:
      clickhouse:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    image: ${REGISTRY_IMAGE_PATH}/backend:${TAG:-latest}
    build: ./backend
    container_name: log-backend
    restart: unless-stopped
    networks: [ pipeline_network ]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--q", "http://localhost:8000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # ── Log Dashboard (Nginx) ──────────────────────────────────────────────────
  log-dashboard:
    image: ${REGISTRY_IMAGE_PATH}/dashboard:${TAG:-latest}
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: log-dashboard
    restart: unless-stopped
    networks: [ pipeline_network ]
    ports:
      - "8801:80"
    env_file:
      - .env
    depends_on:
      - backend
      - clickhouse
    healthcheck:
      test: [ "CMD", "wget", "-q", "http://localhost/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # ── Backup Cron Service ──────────────────────────────────────────────────
  backup:
    image: ${REGISTRY_IMAGE_PATH}/backup:${TAG:-latest}
    build: ./backup
    container_name: backup
    restart: unless-stopped
    networks: [ pipeline_network ]
    env_file:
      - .env
    volumes:
      - /mnt/Logstore_backup:/backups
      - /mnt/Logstore_backup:/clickhouse_user_files/backups
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  # Prometheus, Grafana, Alertmanager, cAdvisor run on separate VM — not here.

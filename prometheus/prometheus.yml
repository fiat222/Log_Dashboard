global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: otel-gateway
    static_configs:
      - targets: ['otel-gateway:8888']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

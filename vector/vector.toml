[api]
enabled = false

[sources.nginx_access]
type = "file"
include = ["/var/log/nginx/access.log"]
read_from = "end"
ignore_older_secs = 86400

[transforms.parse_and_enrich]
type   = "remap"
inputs = ["nginx_access"]
source = '''
  # 1. Parsing
  parsed, err = parse_json(.message)
  if err != null {
    parsed, err = parse_nginx_log(.message, format: "combined")
    if err != null {
      parsed, err = parse_regex(.message, r'^(?P<client>[\d\.]+) - (?P<user>[^ ]+) \[(?P<time>[^\]]+)\] "(?P<request>[^"]+)" (?P<status>\d+) (?P<size>\d+)')
      if err != null {
        msg, _ = to_string(.message)
        log("Parse failed for line: " + msg, level: "debug")
        abort
      }
    }
  }

  # 2. Merge
  . = merge!(., parsed)

  # 3. Field Mapping
  if exists(.client) { .remote_addr = del(.client) }
  if exists(.agent)  { .user_agent  = del(.agent) }

  # 4. Request parsing
  req, _ = to_string(.request)
  if req == "" {
    req, _ = to_string(.uri)
  }

  if req != "" {
    parts = split(req, " ")
    .method = get(parts, [0]) ?? "GET"
    .path   = get(parts, [1]) ?? "/"
    del(.request)
    del(.uri)
  }

  # 5. Timestamp
  if exists(.time) {
    ts, err = parse_timestamp(.time, format: "%d/%b/%Y:%H:%M:%S %z")
    if err == null {
      .timestamp = ts
    } else {
      .timestamp = now()
    }
    del(.time)
  } else if !exists(.timestamp) {
    .timestamp = now()
  }

  # 6. Type Casting
  .status = to_int(.status) ?? 0

  val = .size
  if val == null {
    val = .bytes_sent
  }
  .bytes_sent = to_int(val) ?? 0

  .request_time = to_float(.request_time) ?? 0.0

  # 7. Metadata cleanup
  p = .path
  if p == null { p = "/" }

  p_str, _ = to_string(p)
  .path = replace(p_str, r'\?.*', "")

  host, _ = get_hostname()
  .source_host = host

  del(.message)
  del(.file)
  del(.host)
'''

[transforms.filter_noise]
type = "filter"
inputs = ["parse_and_enrich"]
condition = '''
path, _ = to_string(.path)
!includes(["/health", "/healthz", "/ping", "/ready", "/favicon.ico"], path) &&
!starts_with(path, "/static/") &&
!starts_with(path, "/assets/")

'''

[sinks.redis_vm_log_dashboard]
type = "redis"
inputs = ["filter_noise"]
url = "redis://${REDIS_HOST:-localhost}:${REDIS_PORT:-6379}"
key = "nginx"
data_type = "list"

  [sinks.redis_vm_log_dashboard.list]
  method = "rpush"

  [sinks.redis_vm_log_dashboard.encoding]
  codec = "json"
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log Dashboard — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --psu-blue: #004B93;
      --psu-blue-mid: #1a5fa8;
      --accent: #004B93;
      --bg: #f5f6f8;
      --surface: #ffffff;
      --border: #e2e6ea;
      --border-focus: #004B93;
      --text: #0d1117;
      --text-muted: #6b7280;
      --text-dim: #374151;
      --error: #c0392b;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Inter', sans-serif;
    }

    html, body { height: 100%; font-family: var(--sans); }

    body {
      background: #dde4ef;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* Dot grid */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, rgba(0,75,147,0.15) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
      z-index: 0;
    }

    /* Animated blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(70px);
      pointer-events: none;
      z-index: 0;
    }

    .blob-1 {
      width: 500px;
      height: 500px;
      background: rgba(0, 75, 147, 0.22);
      top: -100px;
      left: -120px;
      animation: blobMove1 14s ease-in-out infinite alternate;
    }

    .blob-2 {
      width: 420px;
      height: 420px;
      background: rgba(14, 100, 190, 0.18);
      bottom: -80px;
      right: -100px;
      animation: blobMove2 17s ease-in-out infinite alternate;
    }

    .blob-3 {
      width: 300px;
      height: 300px;
      background: rgba(0, 140, 220, 0.13);
      top: 50%;
      left: 55%;
      animation: blobMove3 20s ease-in-out infinite alternate;
    }

    @keyframes blobMove1 {
      0%   { transform: translate(0px,   0px)  scale(1);    }
      50%  { transform: translate(60px,  40px) scale(1.08); }
      100% { transform: translate(20px,  80px) scale(0.95); }
    }

    @keyframes blobMove2 {
      0%   { transform: translate(0px,   0px)   scale(1);    }
      50%  { transform: translate(-50px, -30px) scale(1.1);  }
      100% { transform: translate(-20px, -70px) scale(0.92); }
    }

    @keyframes blobMove3 {
      0%   { transform: translate(0px,  0px)  scale(1);    }
      50%  { transform: translate(-40px, 30px) scale(1.15); }
      100% { transform: translate(30px, -40px) scale(0.9);  }
    }

    .login-card { position: relative; z-index: 1; }

    /* ── Card ───────────────────────────── */
    .login-card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07), 0 1px 4px rgba(0,0,0,0.04);
      overflow: hidden;
      animation: fadeUp 0.3s ease both;
    }

    /* Card top bar */
    .card-top {
      background: var(--psu-blue);
      padding: 24px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }

    .card-top::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    .brand-icon svg { width: 16px; height: 16px; }

    .brand-text { position: relative; z-index: 1; }

    .brand-name {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .brand-sub {
      font-family: var(--mono);
      font-size: 10px;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.04em;
      margin-top: 2px;
    }

    /* Card body */
    .card-body {
      padding: 28px 32px 32px;
    }

    .login-form-wrap {
      width: 100%;
    }

    .form-heading {
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .form-subheading {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    /* SSO button */
    .btn-sso {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 16px;
      background: var(--psu-blue);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, box-shadow 0.15s;
      margin-bottom: 20px;
      letter-spacing: -0.01em;
    }

    .btn-sso:hover {
      background: var(--psu-blue-mid);
      box-shadow: 0 2px 8px rgba(0,75,147,0.25);
    }

    .btn-sso:active { opacity: 0.9; }

    .sso-icon {
      width: 20px;
      height: 20px;
      background: rgba(255,255,255,0.15);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sso-icon svg { width: 12px; height: 12px; }

    .btn-sso-label { flex: 1; }

    .btn-sso-arrow {
      opacity: 0.5;
      font-size: 14px;
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .divider-text {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      white-space: nowrap;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* Form */
    .admin-form { display: flex; flex-direction: column; gap: 12px; }

    .form-group { display: flex; flex-direction: column; gap: 5px; }

    .form-group label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .form-input {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      width: 100%;
    }

    .form-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(0,75,147,0.1);
    }

    .form-input::placeholder { color: #b0b8c4; }

    .password-wrapper { position: relative; }

    .password-wrapper input { padding-right: 52px; }

    .pw-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.04em;
      padding: 2px 4px;
      transition: color 0.15s;
      text-transform: uppercase;
    }

    .pw-toggle:hover { color: var(--psu-blue); }

    .btn-admin {
      background: var(--text);
      color: #fff;
      border: none;
      border-radius: 5px;
      padding: 10px;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 4px;
      letter-spacing: -0.01em;
    }

    .btn-admin:hover { background: #1f2937; }
    .btn-admin:active { background: #374151; }

    .btn-admin:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Error */
    .error-banner {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 5px;
      color: var(--error);
      font-size: 12px;
      padding: 8px 12px;
      display: none;
      line-height: 1.4;
    }

    .error-banner.show { display: block; }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 1.5px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Fade-in */
    .login-form-wrap {
      animation: fadeUp 0.3s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }

  </style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="login-card">

    <!-- Blue top bar -->
    <div class="card-top">
      <div class="brand-icon">
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="9" width="2" height="6" rx="1" fill="white" opacity="0.9"/>
          <rect x="5" y="6" width="2" height="9" rx="1" fill="white" opacity="0.9"/>
          <rect x="9" y="3" width="2" height="12" rx="1" fill="white" opacity="0.9"/>
          <rect x="13" y="1" width="2" height="14" rx="1" fill="white" opacity="0.9"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-name">Log Dashboard</div>
        <div class="brand-sub">PRINCE OF SONGKLA UNIVERSITY · EILA</div>
      </div>
    </div>

    <!-- Form body -->
    <div class="card-body">
      <div class="login-form-wrap">

        <h1 class="form-heading">Sign in</h1>
        <p class="form-subheading">Access your organization's log dashboard.</p>

        <!-- PSU SSO -->
        <a id="btn-sso" class="btn-sso" href="/logstore/auth/sso">
          <span class="sso-icon">
            <svg viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="6" cy="4" r="2.5" stroke="white" stroke-width="1.2"/>
              <path d="M1.5 10.5c0-2.485 2.015-4 4.5-4s4.5 1.515 4.5 4" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="btn-sso-label">Continue with PSU Passport</span>
          <span class="btn-sso-arrow">›</span>
        </a>

        <div class="divider">
          <span class="divider-text">or admin access</span>
        </div>

        <!-- Admin form -->
        <form class="admin-form" id="admin-form">
          <div class="error-banner" id="error-msg"></div>

          <div class="form-group">
            <label for="username">Username</label>
            <input id="username" class="form-input" type="text" placeholder="admin" autocomplete="username" required />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrapper">
              <input id="password" class="form-input" type="password" placeholder="••••••••" autocomplete="current-password" required />
              <button type="button" id="pw-toggle" class="pw-toggle" tabindex="-1">show</button>
            </div>
          </div>

          <button type="submit" class="btn-admin" id="login-btn">เข้าสู่ระบบ</button>
        </form>

      </div>
    </div>

  </div>

  <script>
    const pwToggle = document.getElementById("pw-toggle");
    const pwInput  = document.getElementById("password");

    pwToggle.addEventListener("click", () => {
      const hidden = pwInput.getAttribute("type") === "password";
      pwInput.setAttribute("type", hidden ? "text" : "password");
      pwToggle.textContent = hidden ? "hide" : "show";
    });

    document.getElementById("admin-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn      = document.getElementById("login-btn");
      const errEl    = document.getElementById("error-msg");
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>กำลังเข้าสู่ระบบ…';
      errEl.classList.remove("show");

      try {
        const res = await fetch("/logstore/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
          credentials: "include"
        });

        if (res.ok) {
          if (typeof BroadcastChannel !== "undefined") {
            new BroadcastChannel("logdash_auth").postMessage({ type: "login" });
          }
          window.location.href = "/logstore/";
        } else {
          const data = await res.json().catch(() => ({}));
          errEl.textContent = data.detail || "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง";
          errEl.classList.add("show");
        }
      } catch {
        errEl.textContent = "ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้";
        errEl.classList.add("show");
      } finally {
        btn.disabled = false;
        btn.textContent = "เข้าสู่ระบบ";
      }
    });
  </script>
</body>
</html>

# =============================================================================
# traefik/traefik.yml — Minimal Traefik v3 configuration
# Docker provider: auto-discovers services via container labels.
# No static routing configs needed — all routing defined in docker-compose labels.
# =============================================================================

# ── Global ────────────────────────────────────────────────────────────────────
global:
  checkNewVersion: false          # Disable version-check phone-home
  sendAnonymousUsage: false

# ── API + Dashboard ───────────────────────────────────────────────────────────
api: {}

# ── Ping (required for healthcheck) ──────────────────────────────────────────
ping: {}

# ── Entry Points ──────────────────────────────────────────────────────────────
entryPoints:
  web:
    address: ":80"
    # Redirect all HTTP → HTTPS (uncomment when TLS is configured)
    # http:
    #   redirections:
    #     entryPoint:
    #       to: websecure
    #       scheme: https



# ── Providers ─────────────────────────────────────────────────────────────────
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: "pipeline_network"

  # ── File provider: for dynamic config if needed later ─────────────────────
  # file:
  #   directory: /etc/traefik/dynamic/
  #   watch: true

# ── Logging ───────────────────────────────────────────────────────────────────
log:
  level: INFO                     # Reduce noise; use INFO for debugging

accessLog:
  # Log access to stdout so Docker captures it via Filebeat.
  format: json
  fields:
    defaultMode: drop             # Drop most fields to reduce log volume
    names:
      StartUTC: keep
      RequestMethod: keep
      RequestPath: keep
      DownstreamStatus: keep
      Duration: keep
      ServiceName: keep


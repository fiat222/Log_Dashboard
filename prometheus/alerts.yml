groups:
  - name: observability
    rules:
      - alert: OtelGatewayExporterFailure
        expr: rate(otelcol_exporter_send_failed_log_records_total[5m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "OTel Gateway dropping logs — check ClickHouse connection"

      - alert: ClickHousePartsExplosion
        expr: ClickHouseAsyncMetrics_MaxPartCountForPartition > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "ClickHouse parts not merging — possible async_insert queue backup"

      - alert: ContainerHighMemory
        expr: container_memory_usage_bytes{name!=""} / container_spec_memory_limit_bytes{name!=""} > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} memory > 85% of limit"
